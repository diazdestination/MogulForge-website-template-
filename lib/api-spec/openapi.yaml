openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Painless GrowthOS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: me
    description: Current user context
  - name: contacts
  - name: properties
  - name: leads
  - name: tasks
  - name: appointments
  - name: activities
  - name: users
  - name: public
    description: Public (unauthenticated) endpoints
  - name: portal
    description: Homeowner portal (OTP-verified homeowner sessions)
  - name: conversations
    description: AI Concierge conversations
  - name: analytics
  - name: audit
  - name: dashboard
  - name: settings
  - name: templates
  - name: automations
  - name: playbooks
  - name: reactivation
  - name: webhooks
  - name: tags
  - name: api-keys
    description: Org-scoped API key management
  - name: estimates
    description: Job estimates linked to leads
  - name: projects
    description: Production projects for won jobs
  - name: assistant
    description: CRM AI assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get the current CRM user with organization context
      responses:
        "200":
          description: Current member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List members of the organization
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /v1/users/invite:
    post:
      operationId: inviteUser
      tags: [users]
      summary: Invite a new team member by email (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserInput"
      responses:
        "201":
          description: Invited member (activates on first sign-in)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitedMember"
        "400":
          description: Invalid invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A member with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change a member's role or active status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not allowed (e.g. changing your own role or an owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/users/{id}/resend-invite:
    post:
      operationId: resendInvite
      tags: [users]
      summary: Re-send the invite email for a pending invite (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Result of the resend attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteEmailResult"
        "400":
          description: Not a pending invite or missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/installation:
    get:
      operationId: getInstallation
      tags: [installation]
      summary: Current public installation key and authorized domains (admin only)
      responses:
        "200":
          description: Installation configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
  /v1/installation/checks:
    post:
      operationId: checkInstallation
      tags: [installation]
      summary: Test a domain for a correct closer.js installation (admin only)
      description: Server-side fetch of the domain's homepage to detect the snippet and verify the key. The latest result per domain is kept and returned on GET /v1/installation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInstallationInput"
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationCheckResult"
        "400":
          description: Invalid domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/knowledge:
    get:
      operationId: listKnowledgeEntries
      tags: [knowledge]
      summary: List the org's knowledge-base entries (admin only)
      responses:
        "200":
          description: Knowledge entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeEntry"
    post:
      operationId: createKnowledgeEntry
      tags: [knowledge]
      summary: Add a knowledge-base entry (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeEntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "400":
          description: Invalid entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/knowledge/{id}:
    patch:
      operationId: updateKnowledgeEntry
      tags: [knowledge]
      summary: Update a knowledge-base entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeEntryPatch"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "400":
          description: Invalid entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteKnowledgeEntry
      tags: [knowledge]
      summary: Delete a knowledge-base entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/forms:
    get:
      operationId: listForms
      tags: [forms]
      summary: List the org's smart forms (admin only)
      responses:
        "200":
          description: Forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartForm"
    post:
      operationId: createForm
      tags: [forms]
      summary: Create a smart form (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartFormInput"
      responses:
        "201":
          description: Created form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartForm"
        "400":
          description: Invalid form definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/forms/{id}:
    patch:
      operationId: updateForm
      tags: [forms]
      summary: Update a smart form (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartFormPatch"
      responses:
        "200":
          description: Updated form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartForm"
        "400":
          description: Invalid form definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteForm
      tags: [forms]
      summary: Delete a smart form; forms that already have submissions are archived instead (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                type: object
                required: [outcome]
                properties:
                  outcome:
                    type: string
                    enum: [deleted, archived]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/forms/{id}/submissions:
    get:
      operationId: listFormSubmissions
      tags: [forms]
      summary: List submissions of a smart form (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormSubmissionRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/forms/{id}/share:
    get:
      operationId: getFormShareAssets
      tags: [forms]
      summary: Hosted page URL, embed snippet, and QR code (SVG) for a smart form (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Share assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormShareAssets"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/public/forms/{slug}:
    get:
      operationId: getPublicForm
      tags: [public]
      summary: Published form definition for the embed runtime and hosted pages
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public form definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFormDefinition"
        "404":
          description: Not found or unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/public/forms/{slug}/submissions:
    post:
      operationId: submitPublicForm
      tags: [public]
      summary: Submit a smart form (public, rate limited)
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFormBody"
      responses:
        "201":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitFormResult"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Form not found or unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/installation/rotate:
    post:
      operationId: rotateInstallationKey
      tags: [installation]
      summary: Rotate the public installation key — the old key stops working immediately (admin only)
      responses:
        "201":
          description: The freshly issued key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationKey"
  /v1/installation/domains:
    post:
      operationId: addAuthorizedDomain
      tags: [installation]
      summary: Authorize a website domain for the installation key (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAuthorizedDomainInput"
      responses:
        "201":
          description: The authorized domain (normalized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedDomain"
        "400":
          description: Invalid domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/installation/domains/{id}:
    delete:
      operationId: removeAuthorizedDomain
      tags: [installation]
      summary: Remove an authorized domain (admin only)
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List API keys (admin only)
      responses:
        "200":
          description: API keys (hashes never returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create an API key — the full key is returned once (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyInput"
      responses:
        "201":
          description: Created key, including the one-time full secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/api-keys/{id}:
    patch:
      operationId: updateApiKey
      tags: [api-keys]
      summary: Update an active API key's name and/or expiration date (admin only)
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApiKeyInput"
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          description: Invalid request (e.g. past date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key (admin only)
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max rows to return (server caps at 200).
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Number of rows to skip, for paging past earlier results (server treats negatives as 0).
          schema:
            type: integer
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /v1/contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateContact
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteContact
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/properties:
    get:
      operationId: listProperties
      tags: [properties]
      parameters:
        - name: contactId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Max rows to return (server caps at 200).
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Number of rows to skip, for paging past earlier results (server treats negatives as 0).
          schema:
            type: integer
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
  /v1/properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateProperty
      tags: [properties]
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/leads:
    get:
      operationId: listLeads
      tags: [leads]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: assignedUserId
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Filter by lead source value (e.g. 'nationwide-inquiry').
          schema:
            type: string
        - name: search
