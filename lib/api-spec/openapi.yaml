    WebhookEndpoint:
      type: object
      required: [id, url, events, isActive]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        previousSecretExpiresAt:
          type: string
          nullable: true
          description: >-
            When a secret rotation grace window is active, the ISO timestamp
            after which the old secret stops being honored. Null when no
            rotation is in flight. The old secret itself is never returned.
    WebhookEndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >-
                HMAC-SHA256 signing secret. Shown only once at creation and
                stored encrypted. Deliveries carry an
                `X-Painless-Signature` header of the form
                `t=<unix_seconds>,v1=<hex hmac>` where the HMAC-SHA256 is
                computed over `"<t>.<raw request body>"` using this secret.
                Receivers should recompute the HMAC, compare in constant
                time, and reject timestamps older than ~5 minutes.
    WebhookEndpointInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
    RotateWebhookSecretInput:
      type: object
      properties:
        gracePeriodHours:
          type: integer
          minimum: 0
          description: >-
            Hours the old secret keeps being honored alongside the new one
            (deliveries carry both signatures). 0 revokes it immediately.
            Defaults to 24; capped at 168 (7 days).
    WebhookEndpointUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        isActive:
          type: boolean
    WebhookDelivery:
      type: object
      required: [id, endpointId, event, status, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        event:
          type: string
        status:
          type: string
          enum: [pending, success, failed]
        attempts:
          type: integer
        signatureVersion:
          type: string
          description: Signing scheme version used for this delivery (e.g. "v1").
        responseStatus:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
        deliveredAt:
          type: string
          nullable: true
        createdAt:
          type: string
