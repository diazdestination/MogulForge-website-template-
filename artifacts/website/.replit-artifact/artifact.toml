kind = "web"
previewPath = "/"
title = "Painless Roofing Website"
description = "Public conversion website for Painless Roofing & Water Restoration: homepage with four intent pathways, multi-step roof-assessment lead capture with consent, mock storm-check page, and first-party analytics funnel events."
version = "1.0.0"
id = "artifacts/website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19161

[services.development]
run = "pnpm --filter @workspace/website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/website", "run", "build" ]
serve = "static"
publicDir = "artifacts/website/dist/public"

[[services.production.rewrites]]
from = "/storm-check"
to = "/storm-check/index.html"

[[services.production.rewrites]]
from = "/assessment"
to = "/assessment/index.html"

